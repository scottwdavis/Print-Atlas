name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build locked release and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Test tagged source before publishing
        shell: pwsh
        run: cargo test --locked --all-targets
      - name: Preserve release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Print-Atlas-windows-x64
          if-no-files-found: error
          path: |
            release/Print-Atlas-Setup.exe
            release/Print-Atlas-*-windows-x64.zip
            release/SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body: |
            Windows x64 native application. Download **Print-Atlas-Setup.exe** for the per-user installer, or extract the portable ZIP into a writable folder and run **Print Atlas.exe**.

            Both packages include the PDFium runtime and its license notices. No Rust, Node.js, browser runtime, or separate PDF installation is required. The installer and executable are not code-signed; Windows SmartScreen may show an unknown-publisher warning.

            Project source is licensed under GPLv3. The corresponding source for this build is available through this release's **Source code** downloads and tagged repository. Project and third-party license notices are included in the packages.

            Verify downloads against **SHA256SUMS.txt** using PowerShell `Get-FileHash -Algorithm SHA256`.
          files: |
            release/Print-Atlas-Setup.exe
            release/Print-Atlas-*-windows-x64.zip
            release/SHA256SUMS.txt
